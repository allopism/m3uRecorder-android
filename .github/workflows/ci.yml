name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Tests y APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Las descargas grandes (Gradle, compilador de Kotlin) fallan a veces con 504 o timeout en
      # las máquinas de GitHub Actions. Si el fallo es de red se reintenta (hasta 4 veces);
      # si falla una prueba o la compilación, se para a la primera.
      - name: Pruebas unitarias y APK (debug)
        run: |
          for i in 1 2 3 4; do
            if ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -qiE "Could not (GET|download|resolve)|timed? ?out|status code 50[234]|response code: 50[234]" build.log; then
              exit 1
            fi
            echo "::warning::Fallo de red en la descarga (intento $i de 4); reintentando en 30 s"
            sleep 30
          done
          exit 1
        shell: bash -o pipefail {0}

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: m3uRecorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
